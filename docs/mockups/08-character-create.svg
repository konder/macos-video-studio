<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" font-family="-apple-system, 'Helvetica Neue', Arial, 'PingFang SC', sans-serif">
  <rect width="1280" height="800" rx="14" fill="#f7f7fa" stroke="#d6d6dd"/>
  <rect width="1280" height="48" rx="14" fill="#ececf0"/><rect y="34" width="1280" height="14" fill="#ececf0"/>
  <circle cx="26" cy="24" r="6.5" fill="#ff5f57"/><circle cx="48" cy="24" r="6.5" fill="#febc2e"/><circle cx="70" cy="24" r="6.5" fill="#28c840"/>
  <text x="120" y="29" font-size="14" fill="#3a3a3c" font-weight="600">ReelForge — 新建角色「林夏」（写实 / 二次元 · 文本 / 参考图）</text>

  <!-- step ribbon -->
  <g font-size="11.5">
    <circle cx="40" cy="78" r="11" fill="#0a84ff"/><text x="40" y="82" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="56" y="82" fill="#1a1a1a" font-weight="600">来源</text>
    <line x1="110" y1="78" x2="170" y2="78" stroke="#cfcfd6"/>
    <circle cx="184" cy="78" r="11" fill="#0a84ff"/><text x="184" y="82" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="200" y="82" fill="#1a1a1a" font-weight="600">风格</text>
    <line x1="252" y1="78" x2="312" y2="78" stroke="#cfcfd6"/>
    <circle cx="326" cy="78" r="11" fill="#0a84ff"/><text x="326" y="82" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="342" y="82" fill="#1a1a1a" font-weight="600">多视角定稿</text>
    <line x1="430" y1="78" x2="490" y2="78" stroke="#cfcfd6"/>
    <circle cx="504" cy="78" r="11" fill="#c7c7cf"/><text x="504" y="82" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="520" y="82" fill="#9a9aa0" font-weight="600">身份锁定</text>
  </g>

  <!-- LEFT: source + style -->
  <rect x="14" y="100" width="372" height="686" rx="10" fill="#ffffff" stroke="#e3e3e9"/>
  <text x="32" y="128" font-size="12.5" fill="#9a9aa0" font-weight="600">① 来源</text>
  <rect x="30" y="138" width="170" height="26" rx="7" fill="#dcecff" stroke="#0a84ff"/><text x="115" y="155" font-size="11.5" fill="#0a5ad0" text-anchor="middle" font-weight="700">文本描述</text>
  <rect x="206" y="138" width="170" height="26" rx="7" fill="#f4f4f7"/><text x="291" y="155" font-size="11.5" fill="#8a8a90" text-anchor="middle">上传参考图</text>
  <rect x="30" y="172" width="346" height="80" rx="8" fill="#fcfcfe" stroke="#e3e3e9"/>
  <text x="42" y="194" font-size="11" fill="#3a3a3c">25 岁亚洲女性，齐肩黑发，</text>
  <text x="42" y="212" font-size="11" fill="#3a3a3c">红色风衣，冷峻气质，</text>
  <text x="42" y="230" font-size="11" fill="#3a3a3c">电影感打光。</text>
  <text x="32" y="280" font-size="10.5" fill="#9a9aa0">（或拖入 1–3 张参考图：真人 / 既有形象，</text>
  <text x="32" y="296" font-size="10.5" fill="#9a9aa0">两种来源最终收敛成同一份角色档案）</text>

  <text x="32" y="336" font-size="12.5" fill="#9a9aa0" font-weight="600">② 美术风格</text>
  <rect x="30" y="346" width="170" height="56" rx="9" fill="#dcecff" stroke="#0a84ff" stroke-width="2"/><text x="115" y="372" font-size="12" fill="#0a5ad0" text-anchor="middle" font-weight="700">写实</text><text x="115" y="390" font-size="9.5" fill="#3a6ad0" text-anchor="middle">人脸识别类锁定可用</text>
  <rect x="206" y="346" width="170" height="56" rx="9" fill="#ffffff" stroke="#cfcfd6"/><text x="291" y="372" font-size="12" fill="#3a3a3c" text-anchor="middle">二次元</text><text x="291" y="390" font-size="9.5" fill="#9a9aa0" text-anchor="middle">IPAdapter + 角色 LoRA</text>

  <rect x="30" y="730" width="346" height="40" rx="10" fill="#0a84ff"/><text x="203" y="755" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">生成多视角定稿 ▸</text>

  <!-- CENTER: turnaround grid -->
  <rect x="402" y="100" width="470" height="686" rx="10" fill="#fcfcfe" stroke="#e3e3e9"/>
  <text x="420" y="128" font-size="12.5" fill="#9a9aa0" font-weight="600">③ 多视角定稿（Agent 用 char_turnaround 配方）</text>
  <g>
    <rect x="420" y="144" width="210" height="150" rx="8" fill="#1c1c22"/><circle cx="525" cy="205" r="22" fill="#3a3a46"/><path d="M495 258 q30 -40 60 0 z" fill="#3a3a46"/><text x="430" y="284" font-size="10" fill="#8a8a90">正面</text>
    <rect x="644" y="144" width="210" height="150" rx="8" fill="#1c1c22"/><circle cx="749" cy="205" r="22" fill="#3a3a46"/><text x="654" y="284" font-size="10" fill="#8a8a90">侧面 3/4</text>
    <rect x="420" y="306" width="210" height="150" rx="8" fill="#1c1c22"/><circle cx="525" cy="367" r="22" fill="#3a3a46"/><text x="430" y="446" font-size="10" fill="#8a8a90">背面</text>
    <rect x="644" y="306" width="210" height="150" rx="8" fill="#1c1c22"/><circle cx="749" cy="367" r="22" fill="#3a3a46"/><text x="654" y="446" font-size="10" fill="#8a8a90">表情 / 姿态</text>
  </g>
  <rect x="420" y="476" width="434" height="56" rx="9" fill="#f4f4f7"/>
  <text x="436" y="498" font-size="11" fill="#3a3a3c" font-weight="600">Agent：已出 4 视角，一致性自检通过（相似度 0.86）</text>
  <text x="436" y="518" font-size="10.5" fill="#0a84ff">重生成某一张 · 调整描述 · 满意则锁定 →</text>
  <text x="420" y="566" font-size="10.5" fill="#9a9aa0">本地 5090 · Flux + char_turnaround · 约 35s</text>

  <!-- RIGHT: identity lock card -->
  <rect x="888" y="100" width="378" height="686" rx="10" fill="#ffffff" stroke="#c9a6ff" stroke-width="2"/>
  <text x="906" y="128" font-size="12.5" fill="#7a4ad0" font-weight="700">④ 身份锁定卡 · Character Bible</text>
  <rect x="906" y="140" width="342" height="120" rx="8" fill="#faf6ff"/>
  <rect x="918" y="152" width="80" height="96" rx="6" fill="#1c1c22"/><circle cx="958" cy="190" r="16" fill="#3a3a46"/>
  <text x="1012" y="168" font-size="12" fill="#1a1a1a" font-weight="700">林夏</text>
  <text x="1012" y="188" font-size="10.5" fill="#6a6a70">风格：写实</text>
  <text x="1012" y="206" font-size="10.5" fill="#6a6a70">来源：文本描述</text>
  <text x="1012" y="224" font-size="10.5" fill="#28a35a">定稿图集：4 张 ✓</text>

  <text x="906" y="290" font-size="11.5" fill="#6a6a70" font-weight="600">身份锁定（按风格自动选）</text>
  <rect x="906" y="300" width="342" height="28" rx="7" fill="#efe4ff"/><text x="918" y="318" font-size="10.5" fill="#5a2da0">写实 → InstantID + IPAdapter-FaceID</text>
  <rect x="906" y="332" width="342" height="28" rx="7" fill="#f4f4f7"/><text x="918" y="350" font-size="10.5" fill="#9a9aa0">（二次元 → IPAdapter + 角色 LoRA）</text>

  <g font-size="11" fill="#3a3a3c">
    <text x="906" y="392">触发词　lin_xia, red_trench</text>
    <text x="906" y="416">相似度阈值　0.80</text>
    <text x="906" y="440">专属 LoRA　可选（5090 训练）</text>
  </g>
  <rect x="906" y="460" width="342" height="1" fill="#eee"/>
  <text x="906" y="486" font-size="10.5" fill="#9a9aa0">锁定后，所有镜头生成自动注入这套档案，</text>
  <text x="906" y="502" font-size="10.5" fill="#9a9aa0">用户不必每次手动设（一致性的核心）。</text>

  <rect x="906" y="730" width="342" height="40" rx="10" fill="#7a4ad0"/><text x="1077" y="755" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">锁定为角色档案 ✓</text>
</svg>
