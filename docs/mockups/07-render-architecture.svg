<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" font-family="-apple-system, 'Helvetica Neue', Arial, 'PingFang SC', sans-serif">
  <defs>
    <marker id="a7" markerWidth="11" markerHeight="11" refX="7" refY="4" orient="auto"><path d="M0 0 L7 4 L0 8 z" fill="#8a8a90"/></marker>
  </defs>
  <rect width="1280" height="820" rx="14" fill="#f7f7fa" stroke="#d6d6dd"/>
  <text x="40" y="44" font-size="19" fill="#1a1a1a" font-weight="700">渲染架构 — 混合：Metal 基底 + 可回收 SwiftUI 叠加池</text>
  <text x="40" y="68" font-size="13" fill="#8a8a90">同屏可有上千节点，但只为「视口内 + 近景 + 选中/编辑」的少数节点物化成富 SwiftUI 视图（像 TableView 复用 cell）</text>

  <!-- ===== exploded 3-layer stack (back→front) ===== -->
  <!-- back: Metal links -->
  <rect x="360" y="470" width="540" height="120" rx="10" fill="#eef2f8" stroke="#9aa6c0" stroke-width="1.5"/>
  <text x="376" y="492" font-size="12.5" fill="#3a4a70" font-weight="700">③ Metal 连线层</text>
  <text x="376" y="510" font-size="10.5" fill="#6a7a9a">成百上千 bezier · GPU 实例化</text>
  <rect x="836" y="476" width="48" height="18" rx="6" fill="#3a4a70"/><text x="860" y="489" font-size="10" fill="#fff" text-anchor="middle">GPU</text>
  <g stroke="#7a8ab0" stroke-width="2" fill="none">
    <path d="M470 560 C540 560 560 545 630 545"/><path d="M470 535 C540 535 560 552 630 552"/>
    <path d="M700 548 C760 548 770 562 830 562"/><path d="M470 575 C560 575 580 568 700 568"/>
  </g>

  <!-- mid: Metal node bases -->
  <rect x="320" y="320" width="540" height="120" rx="10" fill="#eef2f8" stroke="#9aa6c0" stroke-width="1.5"/>
  <text x="336" y="342" font-size="12.5" fill="#3a4a70" font-weight="700">② Metal 节点底</text>
  <text x="336" y="360" font-size="10.5" fill="#6a7a9a">全部节点的廉价代理（盒/纹理/缩略）· 按 LOD</text>
  <rect x="796" y="326" width="48" height="18" rx="6" fill="#3a4a70"/><text x="820" y="339" font-size="10" fill="#fff" text-anchor="middle">GPU</text>
  <g fill="#dfe4ee" stroke="#b9c0d0">
    <rect x="372" y="386" width="56" height="34" rx="6"/><rect x="446" y="386" width="56" height="34" rx="6"/>
    <rect x="520" y="386" width="56" height="34" rx="6"/><rect x="594" y="386" width="56" height="34" rx="6"/>
    <rect x="668" y="386" width="56" height="34" rx="6"/><rect x="742" y="386" width="56" height="34" rx="6"/>
  </g>
  <text x="372" y="436" font-size="10" fill="#9a9aa0">其余节点 → 仅 Metal 代理（不创建 SwiftUI 视图）</text>

  <!-- front: SwiftUI pool -->
  <rect x="280" y="170" width="540" height="120" rx="10" fill="#ffffff" stroke="#0a84ff" stroke-width="2"/>
  <text x="296" y="192" font-size="12.5" fill="#0a5ad0" font-weight="700">① SwiftUI 叠加池（可回收）</text>
  <text x="296" y="210" font-size="10.5" fill="#3a6ad0">仅视口内+近景+选中/编辑的少量节点 · 富控件 / AVKit / 无障碍</text>
  <rect x="742" y="176" width="64" height="18" rx="6" fill="#0a84ff"/><text x="774" y="189" font-size="10" fill="#fff" text-anchor="middle">SwiftUI</text>
  <!-- two rich cards -->
  <g>
    <rect x="372" y="222" width="120" height="56" rx="8" fill="#ffffff" stroke="#0a84ff" stroke-width="2"/>
    <rect x="372" y="222" width="120" height="18" rx="8" fill="#dcecff"/><text x="382" y="235" font-size="9.5" fill="#0a5ad0" font-weight="700">KSampler ♿</text>
    <rect x="382" y="248" width="60" height="8" rx="4" fill="#e3e3e9"/><rect x="382" y="248" width="38" height="8" rx="4" fill="#0a84ff"/>
    <text x="382" y="272" font-size="8.5" fill="#6a6a70">steps 25 · cfg 7</text>
  </g>
  <g>
    <rect x="594" y="222" width="120" height="56" rx="8" fill="#ffffff" stroke="#0a84ff" stroke-width="2"/>
    <rect x="594" y="222" width="120" height="18" rx="8" fill="#dcecff"/><text x="604" y="235" font-size="9.5" fill="#0a5ad0" font-weight="700">角色注入 ♿</text>
    <rect x="604" y="248" width="48" height="22" rx="5" fill="#1c1c22"/><text x="664" y="263" font-size="8.5" fill="#28a35a">identity ✓</text>
  </g>

  <!-- alignment dashed lines: proxy(mid) -> rich card(front) for the 2 materialized -->
  <g stroke="#0a84ff" stroke-width="1.4" stroke-dasharray="4 3" fill="none">
    <path d="M400 386 L432 278"/>
    <path d="M622 386 L654 278"/>
  </g>
  <text x="470" y="332" font-size="10" fill="#0a84ff" font-weight="600">物化 ↑</text>
  <text x="320" y="306" font-size="10.5" fill="#6a6a70">同一节点跨层对齐：代理 ↑ 物化为富视图</text>

  <!-- ===== right column notes ===== -->
  <!-- viewport culling -->
  <rect x="940" y="150" width="300" height="150" rx="10" fill="#ffffff" stroke="#e3e3e9"/>
  <text x="958" y="174" font-size="13" fill="#1a1a1a" font-weight="700">视口剔除</text>
  <rect x="958" y="188" width="160" height="96" rx="8" fill="#f7f7fa" stroke="#0a84ff" stroke-dasharray="4"/>
  <rect x="974" y="204" width="30" height="20" rx="4" fill="#dfe4ee"/><rect x="1016" y="204" width="30" height="20" rx="4" fill="#dfe4ee"/>
  <rect x="974" y="240" width="30" height="20" rx="4" fill="#dfe4ee"/><rect x="1016" y="240" width="30" height="20" rx="4" fill="#dfe4ee"/>
  <rect x="1086" y="172" width="30" height="20" rx="4" fill="#eee" opacity="0.5"/><rect x="930" y="250" width="20" height="20" rx="4" fill="#eee" opacity="0.5"/>
  <text x="1130" y="214" font-size="10.5" fill="#6a6a70">视口外</text><text x="1130" y="230" font-size="10.5" fill="#6a6a70">不进任何层</text>
  <text x="958" y="298" font-size="10.5" fill="#9a9aa0">只处理可见区域，与项目大小解耦</text>

  <!-- hit-test -->
  <rect x="940" y="316" width="300" height="150" rx="10" fill="#ffffff" stroke="#e3e3e9"/>
  <text x="958" y="340" font-size="13" fill="#1a1a1a" font-weight="700">命中测试（不靠 SwiftUI）</text>
  <g stroke="#c7c7cf" fill="none">
    <rect x="958" y="354" width="120" height="96"/>
    <path d="M1018 354 V450 M958 402 H1078"/>
    <path d="M988 354 V402 M958 378 H1018"/>
  </g>
  <circle cx="1003" cy="390" r="4" fill="#0a84ff"/>
  <text x="1092" y="378" font-size="10.5" fill="#6a6a70">quadtree 空间索引</text>
  <text x="1092" y="396" font-size="10.5" fill="#6a6a70">屏幕点→画布点</text>
  <text x="1092" y="414" font-size="10.5" fill="#6a6a70">→ O(log n) 查询</text>
  <text x="1092" y="438" font-size="10.5" fill="#0a84ff">物化视图自带细粒度命中</text>

  <!-- high-freq feedback -->
  <rect x="940" y="482" width="300" height="150" rx="10" fill="#fff7e6" stroke="#f0c869"/>
  <text x="958" y="506" font-size="13" fill="#9a6a10" font-weight="700">高频反馈走 Metal 叠层</text>
  <circle cx="1000" cy="560" r="26" fill="none" stroke="#e3e3e9" stroke-width="6"/>
  <path d="M1000 534 A26 26 0 0 1 1023 575" fill="none" stroke="#28c840" stroke-width="6"/>
  <text x="1000" y="565" font-size="11" fill="#1f8a44" text-anchor="middle" font-weight="700">12/25</text>
  <text x="1050" y="540" font-size="10.5" fill="#9a6a10">进度环 / latent 预览</text>
  <text x="1050" y="558" font-size="10.5" fill="#9a6a10">= 换节点纹理</text>
  <text x="1050" y="582" font-size="10.5" fill="#9a6a10">WS 每秒数十帧</text>
  <text x="1050" y="600" font-size="10.5" fill="#9a6a10">不 churn SwiftUI</text>

  <!-- bottom recommendation -->
  <rect x="40" y="650" width="1200" height="130" rx="11" fill="#eef5ff" stroke="#0a84ff"/>
  <text x="60" y="680" font-size="14" fill="#0a5ad0" font-weight="700">为什么选混合（而非全 SwiftUI / 全 Metal）</text>
  <text x="60" y="708" font-size="12" fill="#3a3a3c">全 SwiftUI：上手最快、内容最丰富，但几百个变换视图同屏会布局/合成崩溃，封顶项目规模。</text>
  <text x="60" y="730" font-size="12" fill="#3a3a3c">全 Metal：最快、能撑最大，但要自己重实现文字/控件/命中测试/无障碍，工作量最大、a11y 最痛。</text>
  <text x="60" y="756" font-size="12.5" fill="#0a5ad0" font-weight="700">混合：Metal 撑规模与高频反馈，SwiftUI 只在「需要交互/无障碍处」按需付费 —— 上手量适中、可渐进扩展。</text>
</svg>
